<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
</style>
    <radialGradient id="voidGlowLumen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#191424"/>
      <stop offset="60%" stop-color="#07050D"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#voidGlowLumen)"/>

  <!-- Pulsing Connector Line to LUMEN -->
  <line x1="720" y1="460" x2="720" y2="680" stroke="#B898FF" stroke-width="3"/>
  <circle cx="720" cy="570" r="4" fill="#FFF"/>

  <!-- Core Entity with Violet Hue -->
  <g transform="translate(720, 460)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(184,152,255,0.15)" stroke-width="2"/>
    <circle cx="0" cy="0" r="105" fill="#140E22" stroke="#B898FF" stroke-width="2"/>
  </g>

  <!-- Expanded LUMEN Card at Bottom -->
  <g transform="translate(575, 620)" filter="url(#shadowDark)">
    <rect width="210" height="42" rx="21" fill="#0E1117" stroke="#B898FF" stroke-width="2"/>
    <circle cx="22" cy="21" r="5" fill="#B898FF"/>
    <text x="36" y="22" class="sans" font-size="13" font-weight="600" fill="#FFF">LUMEN</text>
    <text x="36" y="33" class="mono" font-size="8.5" fill="#D8C7FF">ACTIVE MODULE</text>

    <g transform="translate(0, 56)">
      <rect width="290" height="210" rx="14" fill="#0E1117" stroke="#B898FF" stroke-width="1.2"/>
      <text x="16" y="24" class="mono" font-size="9" fill="#8C95A6" letter-spacing="1">SPECIALIZED MODULE · 03</text>
      <rect x="200" y="12" width="75" height="16" rx="8" fill="rgba(184,152,255,0.15)"/>
      <text x="210" y="23" class="mono" font-size="8" fill="#B898FF">RESEARCH</text>
      <text x="16" y="55" class="serif" font-size="16" font-style="italic" fill="#FFF">Specimen displacement tracking</text>
      <text x="16" y="80" class="sans" font-size="11.5" fill="#9BA6B6">
        <tspan x="16" dy="0">High-precision optical tracking of</tspan>
        <tspan x="16" dy="16">reagents, pipettes, and assays.</tspan>
      </text>
      <g transform="translate(16, 125)">
        <rect x="0" y="0" width="52" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="8" y="14" class="mono" font-size="9" fill="#CBD3DE">Exact</text>
        <rect x="58" y="0" width="78" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="66" y="14" class="mono" font-size="9" fill="#CBD3DE">Systematic</text>
        <rect x="142" y="0" width="72" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="150" y="14" class="mono" font-size="9" fill="#CBD3DE">Analytical</text>
      </g>
    </g>
  </g>
</svg>
