<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200">
  <defs><style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
</style></defs>
  <rect width="1920" height="1200" fill="#FCFBFA"/>

  <!-- Page Header -->
  <g transform="translate(100, 70)">
    <text x="0" y="24" class="mono" font-size="12" font-weight="600" fill="#CF4500" letter-spacing="2">07 / PROTOTYPE &amp; USER FLOWS</text>
    <text x="0" y="64" class="sans" font-size="34" font-weight="700" fill="#141413" letter-spacing="-0.5">End-to-End User Experience Journey</text>
    <line x1="0" y1="88" x2="1720" y2="88" stroke="rgba(20,20,19,0.08)" stroke-width="1"/>
  </g>

  <!-- FLOW 1: Landing -> Story Experience -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#CF4500" letter-spacing="1">FLOW 01 — THE HOME STORY CHOREOGRAPHY</text>

    <!-- Node 1: Landing Home -->
    <g transform="translate(0, 30)">
      <rect width="240" height="160" rx="14" fill="#FFF" stroke="rgba(20,20,19,0.1)" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" font-size="9" fill="#696969">STEP 01</text>
      <text x="20" y="62" class="sans" font-size="16" font-weight="600" fill="#141413">Quiet Afternoon</text>
      <text x="20" y="88" class="sans" font-size="12" fill="#696969">Visitor lands on hero room.</text>
      <rect x="20" y="115" width="130" height="26" rx="13" fill="#141413"/>
      <text x="32" y="132" class="sans" font-size="11" font-weight="600" fill="#FFF">See how it works</text>
    </g>

    <!-- Connecting Arrow -->
    <line x1="240" y1="110" x2="320" y2="110" stroke="#CF4500" stroke-width="2"/>
    <text x="280" y="100" text-anchor="middle" class="mono" font-size="9" fill="#CF4500">On Click</text>

    <!-- Node 2: Camera Choreography -->
    <g transform="translate(320, 30)">
      <rect width="240" height="160" rx="14" fill="#FFF" stroke="rgba(20,20,19,0.1)" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" font-size="9" fill="#696969">STEP 02</text>
      <text x="20" y="62" class="sans" font-size="16" font-weight="600" fill="#141413">Spatial Inspection</text>
      <text x="20" y="88" class="sans" font-size="12" fill="#696969">Camera frames side table.</text>
      <text x="20" y="130" class="mono" font-size="10" fill="#CF4500">2:10 PM: ANCHOR 01</text>
    </g>

    <line x1="560" y1="110" x2="640" y2="110" stroke="#CF4500" stroke-width="2"/>
    <text x="600" y="100" text-anchor="middle" class="mono" font-size="9" fill="#CF4500">Auto Adv.</text>

    <!-- Node 3: Displacement Climax -->
    <g transform="translate(640, 30)">
      <rect width="240" height="160" rx="14" fill="#FFF" stroke="rgba(20,20,19,0.1)" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" font-size="9" fill="#696969">STEP 03</text>
      <text x="20" y="62" class="sans" font-size="16" font-weight="600" fill="#141413">Change Confirmed</text>
      <text x="20" y="88" class="sans" font-size="12" fill="#696969">Glasses located on bookshelf.</text>
      <text x="20" y="130" class="mono" font-size="10" fill="#CF4500">4:40 PM: 4.85M DELTA</text>
    </g>
  </g>

  <!-- FLOW 2: SMRITI -> PHANTOM Reveal Transition -->
  <g transform="translate(100, 480)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#F07B42" letter-spacing="1">FLOW 02 — PHANTOM IMMERSIVE REVEAL</text>

    <!-- Node 1: Trigger -->
    <g transform="translate(0, 30)">
      <rect width="240" height="160" rx="14" fill="#FFF" stroke="rgba(20,20,19,0.1)" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" font-size="9" fill="#696969">TRIGGER</text>
      <text x="20" y="62" class="sans" font-size="16" font-weight="600" fill="#141413">PHANTOM Nav Click</text>
      <text x="20" y="88" class="sans" font-size="12" fill="#696969">User clicks #navPhantomLink.</text>
    </g>

    <line x1="240" y1="110" x2="320" y2="110" stroke="#F07B42" stroke-width="2"/>
    <text x="280" y="100" text-anchor="middle" class="mono" font-size="9" fill="#F07B42">0.8s Ease</text>

    <!-- Node 2: Spatial Collapse -->
    <g transform="translate(320, 30)">
      <rect width="240" height="160" rx="14" fill="#0E1117" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" font-size="9" fill="#8C95A6">TRANSITION</text>
      <text x="20" y="62" class="sans" font-size="16" font-weight="600" fill="#FFF">Gravitational Collapse</text>
      <text x="20" y="88" class="sans" font-size="12" fill="#9BA6B6">SMRITI blurs. Singularity opens.</text>
    </g>

    <line x1="560" y1="110" x2="640" y2="110" stroke="#F07B42" stroke-width="2"/>
    <text x="600" y="100" text-anchor="middle" class="mono" font-size="9" fill="#F07B42">Emergence</text>

    <!-- Node 3: Stabilized Constellation -->
    <g transform="translate(640, 30)">
      <rect width="240" height="160" rx="14" fill="#0E1117" stroke="#F07B42" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" font-size="9" fill="#F07B42">STABILIZED</text>
      <text x="20" y="62" class="sans" font-size="16" font-weight="600" fill="#FFF">Intelligence Constellation</text>
      <text x="20" y="88" class="sans" font-size="12" fill="#9BA6B6">3D Simplex noise sphere &amp; nodes.</text>
    </g>
  </g>
</svg>
