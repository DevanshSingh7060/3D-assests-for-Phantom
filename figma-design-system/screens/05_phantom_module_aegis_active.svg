<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
</style>
    <radialGradient id="voidGlowAegis" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121A24"/>
      <stop offset="60%" stop-color="#06090D"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#voidGlowAegis)"/>

  <!-- Pulsing Connector Line to AEGIS -->
  <line x1="720" y1="460" x2="1110" y2="340" stroke="#6EC1E4" stroke-width="3"/>
  <circle cx="915" cy="400" r="4" fill="#FFF"/>

  <!-- Core Entity with Cyan Hue -->
  <g transform="translate(720, 460)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(110,193,228,0.15)" stroke-width="2"/>
    <circle cx="0" cy="0" r="105" fill="#0C1520" stroke="#6EC1E4" stroke-width="2"/>
  </g>

  <!-- Expanded AEGIS Card on Right -->
  <g transform="translate(970, 280)" filter="url(#shadowDark)">
    <rect width="210" height="42" rx="21" fill="#0E1117" stroke="#6EC1E4" stroke-width="2"/>
    <circle cx="22" cy="21" r="5" fill="#6EC1E4"/>
    <text x="36" y="22" class="sans" font-size="13" font-weight="600" fill="#FFF">AEGIS</text>
    <text x="36" y="33" class="mono" font-size="8.5" fill="#A8DCF0">ACTIVE MODULE</text>

    <g transform="translate(0, 56)">
      <rect width="290" height="210" rx="14" fill="#0E1117" stroke="#6EC1E4" stroke-width="1.2"/>
      <text x="16" y="24" class="mono" font-size="9" fill="#8C95A6" letter-spacing="1">SPECIALIZED MODULE · 02</text>
      <rect x="200" y="12" width="75" height="16" rx="8" fill="rgba(110,193,228,0.15)"/>
      <text x="210" y="23" class="mono" font-size="8" fill="#6EC1E4">CLINICAL</text>
      <text x="16" y="55" class="serif" font-size="16" font-style="italic" fill="#FFF">Perimeter safety &amp; monitoring</text>
      <text x="16" y="80" class="sans" font-size="11.5" fill="#9BA6B6">
        <tspan x="16" dy="0">Patient safety, medication compliance,</tspan>
        <tspan x="16" dy="16">and sterile zone verification.</tspan>
      </text>
      <g transform="translate(16, 125)">
        <rect x="0" y="0" width="62" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="8" y="14" class="mono" font-size="9" fill="#CBD3DE">Rigorous</text>
        <rect x="68" y="0" width="52" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="76" y="14" class="mono" font-size="9" fill="#CBD3DE">Quiet</text>
        <rect x="126" y="0" width="62" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="134" y="14" class="mono" font-size="9" fill="#CBD3DE">Fail-Safe</text>
      </g>
    </g>
  </g>
</svg>
