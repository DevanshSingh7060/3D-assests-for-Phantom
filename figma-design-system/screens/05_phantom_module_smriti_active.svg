<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
</style>
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18141F"/>
      <stop offset="60%" stop-color="#08070B"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342822"/>
      <stop offset="50%" stop-color="#141113"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#voidGlow)"/>

  <!-- Pulsing Connector Line to SMRITI -->
  <line x1="720" y1="460" x2="310" y2="340" stroke="#F07B42" stroke-width="3"/>
  <circle cx="515" cy="400" r="4" fill="#FFF"/>

  <!-- Dimmed other lines -->
  <line x1="720" y1="460" x2="1110" y2="340" stroke="#6EC1E4" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="720" y1="460" x2="720" y2="700" stroke="#B898FF" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Core Entity with Warm Orange Shift -->
  <g transform="translate(720, 460)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(240,123,66,0.15)" stroke-width="2"/>
    <circle cx="0" cy="0" r="105" fill="url(#blobGrad)" stroke="#F07B42" stroke-width="2"/>
  </g>

  <!-- Center Anchor -->
  <g transform="translate(720, 110)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#8C95A6" letter-spacing="2">SPATIAL INTELLIGENCE LAYER</text>
    <text x="0" y="44" text-anchor="middle" class="sans" font-size="44" font-weight="600" fill="#FFF" letter-spacing="3">PHANTOM</text>
    <text x="0" y="74" text-anchor="middle" class="serif" font-size="19" font-style="italic" fill="#F07B42">SMRITI Module Selected</text>
  </g>

  <!-- Expanded SMRITI Card on Left (290px width) -->
  <g transform="translate(180, 280)" filter="url(#shadowDark)">
    <!-- Active Node Pill -->
    <rect width="210" height="42" rx="21" fill="#0E1117" stroke="#F07B42" stroke-width="2"/>
    <circle cx="22" cy="21" r="5" fill="#F07B42"/>
    <text x="36" y="22" class="sans" font-size="13" font-weight="600" fill="#FFF">SMRITI</text>
    <text x="36" y="33" class="mono" font-size="8.5" fill="#FFD8C4">ACTIVE MODULE</text>

    <!-- Expanded Drawer (290px) -->
    <g transform="translate(0, 56)">
      <rect width="290" height="230" rx="14" fill="#0E1117" stroke="#F07B42" stroke-width="1.2"/>
      <text x="16" y="24" class="mono" font-size="9" fill="#8C95A6" letter-spacing="1">SPECIALIZED MODULE · 01</text>
      <rect x="200" y="12" width="75" height="16" rx="8" fill="rgba(240,123,66,0.15)"/>
      <text x="208" y="23" class="mono" font-size="8" fill="#F07B42">HOME ENV</text>

      <text x="16" y="55" class="serif" font-size="16" font-style="italic" fill="#FFF">Spatial memory &amp; reassurance</text>
      <text x="16" y="80" class="sans" font-size="11.5" fill="#9BA6B6">
        <tspan x="16" dy="0">Understands quiet routines, object</tspan>
        <tspan x="16" dy="16">displacement, and lived home spaces.</tspan>
      </text>

      <g transform="translate(16, 125)">
        <rect x="0" y="0" width="46" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="8" y="14" class="mono" font-size="9" fill="#CBD3DE">Soft</text>
        <rect x="52" y="0" width="52" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="60" y="14" class="mono" font-size="9" fill="#CBD3DE">Warm</text>
        <rect x="110" y="0" width="80" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="116" y="14" class="mono" font-size="9" fill="#CBD3DE">Empathetic</text>
        <rect x="196" y="0" width="48" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
        <text x="204" y="14" class="mono" font-size="9" fill="#CBD3DE">Calm</text>
      </g>

      <g transform="translate(16, 170)">
        <rect width="258" height="36" rx="8" fill="#CF4500"/>
        <text x="65" y="22" class="sans" font-size="12" font-weight="600" fill="#FFF">Return to SMRITI site →</text>
      </g>
    </g>
  </g>
</svg>
