<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1400" width="1920" height="1400">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
</style>
    <filter id="shadowNav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="shadowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1920" height="1400" fill="#FCFBFA"/>

  <!-- Page Header -->
  <g id="Page Header" transform="translate(100, 70)">
    <rect width="1720" height="80" fill="none"/>
    <text x="0" y="24" class="mono" font-size="12" font-weight="600" fill="#CF4500" letter-spacing="2">01 / FOUNDATIONS &amp; DESIGN TOKENS</text>
    <text x="0" y="64" class="sans" font-size="34" font-weight="700" fill="#141413" letter-spacing="-0.5">Design Foundations &amp; Token Specifications</text>
    <text x="1720" y="60" text-anchor="end" class="mono" font-size="12" fill="#696969">SMRITI × PHANTOM DESIGN SYSTEM</text>
    <line x1="0" y1="88" x2="1720" y2="88" stroke="rgba(20,20,19,0.08)" stroke-width="1"/>
  </g>

  <!-- SECTION 1: COLOR PALETTE -->
  <g id="Section / Color Palette" transform="translate(100, 190)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#696969" letter-spacing="1.5">01. COLOR TOKENS &amp; ROLES</text>

    <!-- Row 1: SMRITI Light Theme -->
    <text x="0" y="32" class="sans" font-size="14" font-weight="600" fill="#141413">SMRITI Light Surfaces &amp; Neutrals</text>
    <g transform="translate(0, 45)">
      <!-- Swatch 1: Canvas Cream -->
      <g transform="translate(0, 0)">
        <rect width="160" height="90" rx="12" fill="#F3F0EE" stroke="rgba(20,20,19,0.1)" stroke-width="1"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Canvas Cream</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#F3F0EE</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--canvas-cream</text>
      </g>
      <!-- Swatch 2: Lifted Cream -->
      <g transform="translate(180, 0)">
        <rect width="160" height="90" rx="12" fill="#FCFBFA" stroke="rgba(20,20,19,0.1)" stroke-width="1"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Lifted Cream</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#FCFBFA</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--lifted-cream</text>
      </g>
      <!-- Swatch 3: Pure White -->
      <g transform="translate(360, 0)">
        <rect width="160" height="90" rx="12" fill="#FFFFFF" stroke="rgba(20,20,19,0.12)" stroke-width="1"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Pure White</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#FFFFFF</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--white</text>
      </g>
      <!-- Swatch 4: Ink Black -->
      <g transform="translate(540, 0)">
        <rect width="160" height="90" rx="12" fill="#141413"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Ink Black</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#141413</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--ink-black</text>
      </g>
      <!-- Swatch 5: Slate Gray -->
      <g transform="translate(720, 0)">
        <rect width="160" height="90" rx="12" fill="#696969"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Slate Gray</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#696969</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--slate-gray</text>
      </g>
      <!-- Swatch 6: Signal Orange -->
      <g transform="translate(900, 0)">
        <rect width="160" height="90" rx="12" fill="#CF4500"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Signal Orange</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#CF4500</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--signal-orange</text>
      </g>
    </g>

    <!-- Row 2: PHANTOM Dark Theme & Modules -->
    <text x="0" y="210" class="sans" font-size="14" font-weight="600" fill="#141413">PHANTOM Dark Void &amp; Module Accents</text>
    <g transform="translate(0, 225)">
      <!-- Swatch 7: Void Black -->
      <g transform="translate(0, 0)">
        <rect width="160" height="90" rx="12" fill="#050608" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Void Black</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#050608</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--phantom-void-black</text>
      </g>
      <!-- Swatch 8: Deep Charcoal -->
      <g transform="translate(180, 0)">
        <rect width="160" height="90" rx="12" fill="#0E1117" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">Deep Charcoal</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#0E1117</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--phantom-deep-charcoal</text>
      </g>
      <!-- Swatch 9: SMRITI Orange -->
      <g transform="translate(360, 0)">
        <rect width="160" height="90" rx="12" fill="#F07B42"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">SMRITI Module</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#F07B42</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--smriti-module-accent</text>
      </g>
      <!-- Swatch 10: AEGIS Cyan -->
      <g transform="translate(540, 0)">
        <rect width="160" height="90" rx="12" fill="#6EC1E4"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">AEGIS Clinical</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#6EC1E4</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--aegis-module-accent</text>
      </g>
      <!-- Swatch 11: LUMEN Violet -->
      <g transform="translate(720, 0)">
        <rect width="160" height="90" rx="12" fill="#B898FF"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">LUMEN Laboratory</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#B898FF</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--lumen-module-accent</text>
      </g>
      <!-- Swatch 12: Future Module Gray -->
      <g transform="translate(900, 0)">
        <rect width="160" height="90" rx="12" fill="#636B78"/>
        <text x="12" y="112" class="sans" font-size="12" font-weight="600" fill="#141413">NOVA / ORBIT Gray</text>
        <text x="12" y="128" class="mono" font-size="10" fill="#696969">#636B78</text>
        <text x="12" y="142" class="mono" font-size="9" fill="#9A3A0A">--future-module-accent</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: TYPOGRAPHY SYSTEM -->
  <g id="Section / Typography" transform="translate(100, 580)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#696969" letter-spacing="1.5">02. TYPOGRAPHY SYSTEM &amp; SCALE</text>
    <line x1="0" y1="16" x2="1720" y2="16" stroke="rgba(20,20,19,0.08)" stroke-width="1"/>

    <!-- Row 1: Display -->
    <g transform="translate(0, 40)">
      <text x="0" y="30" class="serif" font-size="44" fill="#141413">Display Headline — Your home <tspan font-style="italic">remembers.</tspan></text>
      <text x="1000" y="30" class="mono" font-size="12" fill="#696969">Instrument Serif / 400 / 64px / LH 1.06 / LS -0.01em</text>
      <text x="1500" y="30" class="mono" font-size="11" fill="#CF4500">--text-display-size</text>
    </g>

    <!-- Row 2: Section H1 -->
    <g transform="translate(0, 100)">
      <text x="0" y="24" class="serif" font-size="36" fill="#141413">Section H1 — “Where did I put my <tspan font-style="italic">glasses?</tspan>”</text>
      <text x="1000" y="24" class="mono" font-size="12" fill="#696969">Instrument Serif / 400 / 48px / LH 1.08 / LS -0.01em</text>
      <text x="1500" y="24" class="mono" font-size="11" fill="#CF4500">--text-h1-size</text>
    </g>

    <!-- Row 3: Subhead H3 -->
    <g transform="translate(0, 155)">
      <text x="0" y="20" class="sans" font-size="22" font-weight="500" fill="#141413">Card Subhead H3 — The room, then and now.</text>
      <text x="1000" y="20" class="mono" font-size="12" fill="#696969">Geist / 500 / 22px / LH 1.3 / LS -0.01em</text>
      <text x="1500" y="20" class="mono" font-size="11" fill="#CF4500">--text-h3-size</text>
    </g>

    <!-- Row 4: Body / Lead -->
    <g transform="translate(0, 205)">
      <text x="0" y="16" class="sans" font-size="16" font-weight="400" fill="#262627">Body Lead — SMRITI remembers where everyday things were and reveals what changed.</text>
      <text x="1000" y="16" class="mono" font-size="12" fill="#696969">Geist / 400 / 16px / LH 1.5 / LS -0.005em</text>
      <text x="1500" y="16" class="mono" font-size="11" fill="#CF4500">--text-body-size</text>
    </g>

    <!-- Row 5: Navigation & Buttons -->
    <g transform="translate(0, 255)">
      <text x="0" y="15" class="sans" font-size="14.5" font-weight="600" fill="#141413">Navigation &amp; Primary Button — See how it works →</text>
      <text x="1000" y="15" class="mono" font-size="12" fill="#696969">Geist / 600 / 14.5px / LH 1.0 / LS -0.01em</text>
      <text x="1500" y="15" class="mono" font-size="11" fill="#CF4500">--text-nav-size</text>
    </g>

    <!-- Row 6: Eyebrow / Monospace Metadata -->
    <g transform="translate(0, 305)">
      <text x="0" y="12" class="mono" font-size="11" font-weight="600" fill="#CF4500" letter-spacing="1.5">EYEBROW &amp; TELEMETRY — SPATIAL MEMORY FOR EVERYDAY LIFE</text>
      <text x="1000" y="12" class="mono" font-size="12" fill="#696969">JetBrains Mono / 600 / 11px / LH 1.2 / LS 0.12em</text>
      <text x="1500" y="12" class="mono" font-size="11" fill="#CF4500">--text-eyebrow-size</text>
    </g>
  </g>

  <!-- SECTION 3: SPACING, RADII & ELEVATION -->
  <g id="Section / Dimensions & Elevation" transform="translate(100, 970)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#696969" letter-spacing="1.5">03. SPACING SCALE, CORNER RADII &amp; ELEVATION</text>
    <line x1="0" y1="16" x2="1720" y2="16" stroke="rgba(20,20,19,0.08)" stroke-width="1"/>

    <!-- Spacing Scale Chart -->
    <g transform="translate(0, 40)">
      <text x="0" y="16" class="sans" font-size="13" font-weight="600" fill="#141413">Spacing Scale (8px Base)</text>
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="8" height="36" fill="#CF4500"/>
        <text x="0" y="52" class="mono" font-size="9" fill="#696969">8px</text>

        <rect x="30" y="0" width="16" height="36" fill="#CF4500"/>
        <text x="30" y="52" class="mono" font-size="9" fill="#696969">16px</text>

        <rect x="70" y="0" width="24" height="36" fill="#CF4500"/>
        <text x="70" y="52" class="mono" font-size="9" fill="#696969">24px</text>

        <rect x="120" y="0" width="32" height="36" fill="#CF4500"/>
        <text x="120" y="52" class="mono" font-size="9" fill="#696969">32px</text>

        <rect x="180" y="0" width="40" height="36" fill="#CF4500"/>
        <text x="180" y="52" class="mono" font-size="9" fill="#696969">40px</text>

        <rect x="250" y="0" width="48" height="36" fill="#CF4500"/>
        <text x="250" y="52" class="mono" font-size="9" fill="#696969">48px</text>

        <rect x="330" y="0" width="64" height="36" fill="#CF4500"/>
        <text x="330" y="52" class="mono" font-size="9" fill="#696969">64px</text>

        <rect x="420" y="0" width="96" height="36" fill="#CF4500"/>
        <text x="420" y="52" class="mono" font-size="9" fill="#696969">96px</text>

        <rect x="540" y="0" width="128" height="36" fill="#CF4500"/>
        <text x="540" y="52" class="mono" font-size="9" fill="#696969">128px</text>
      </g>
    </g>

    <!-- Corner Radii -->
    <g transform="translate(800, 40)">
      <text x="0" y="16" class="sans" font-size="13" font-weight="600" fill="#141413">Corner Radius Rules</text>
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="100" height="60" rx="20" fill="#FFFFFF" stroke="rgba(20,20,19,0.15)" stroke-width="1.5"/>
        <text x="14" y="35" class="sans" font-size="12" font-weight="600" fill="#141413">20px (Btn/Card)</text>

        <rect x="130" y="0" width="110" height="60" rx="30" fill="#FFFFFF" stroke="rgba(20,20,19,0.15)" stroke-width="1.5"/>
        <text x="150" y="35" class="sans" font-size="12" font-weight="600" fill="#141413">40px Stadium</text>

        <rect x="270" y="0" width="130" height="60" rx="30" fill="#FFFFFF" stroke="rgba(20,20,19,0.15)" stroke-width="1.5"/>
        <text x="290" y="35" class="sans" font-size="12" font-weight="600" fill="#141413">999px (Pill/Nav)</text>
      </g>
    </g>

    <!-- Elevation & Shadows -->
    <g transform="translate(1300, 40)">
      <text x="0" y="16" class="sans" font-size="13" font-weight="600" fill="#141413">Elevation &amp; Shadows</text>
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="180" height="60" rx="20" fill="#FFFFFF" filter="url(#shadowNav)"/>
        <text x="20" y="35" class="sans" font-size="12" font-weight="600" fill="#141413">Nav Shadow (0 4 24)</text>

        <rect x="210" y="0" width="180" height="60" rx="20" fill="#FFFFFF" filter="url(#shadowCard)"/>
        <text x="230" y="35" class="sans" font-size="12" font-weight="600" fill="#141413">Card Shadow (0 24 48)</text>
      </g>
    </g>
  </g>
</svg>
