<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
</style>
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141824" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#07090E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030406" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3344"/>
      <stop offset="50%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Void Background -->
  <rect width="1440" height="900" fill="url(#voidGlow)"/>

  <!-- Gravitational Warp Simulation -->
  <g opacity="0.18">
    <ellipse cx="720" cy="460" rx="600" ry="320" fill="none" stroke="#FFF" stroke-width="0.7" stroke-dasharray="4 8"/>
    <ellipse cx="720" cy="460" rx="420" ry="220" fill="none" stroke="#FFF" stroke-width="0.8" stroke-dasharray="6 10"/>
    <ellipse cx="720" cy="460" rx="260" ry="140" fill="none" stroke="#FFF" stroke-width="1" stroke-dasharray="8 12"/>
  </g>

  <!-- Constellation Connector Lines (SVG Layer) -->
  <g id="PHANTOM / Constellation Lines">
    <!-- Center to SMRITI Node (Left) -->
    <line x1="720" y1="460" x2="310" y2="340" stroke="#F07B42" stroke-width="1.5" stroke-dasharray="4 6"/>
    <!-- Center to AEGIS Node (Right) -->
    <line x1="720" y1="460" x2="1110" y2="340" stroke="#6EC1E4" stroke-width="1.5" stroke-dasharray="4 6"/>
    <!-- Center to LUMEN Node (Bottom) -->
    <line x1="720" y1="460" x2="720" y2="700" stroke="#B898FF" stroke-width="1.5" stroke-dasharray="4 6"/>
    <!-- Center to NOVA (Planned) -->
    <line x1="720" y1="460" x2="420" y2="640" stroke="#636B78" stroke-width="1" stroke-dasharray="2 4"/>
    <!-- Center to ORBIT (Planned) -->
    <line x1="720" y1="460" x2="1020" y2="640" stroke="#636B78" stroke-width="1" stroke-dasharray="2 4"/>
  </g>

  <!-- Central 3D Procedural Intelligence Entity -->
  <g id="PHANTOM / Core Entity" transform="translate(720, 460)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(142,197,255,0.08)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-dasharray="3 6"/>
    <!-- Fluid Blob Sphere Simulation -->
    <circle cx="0" cy="0" r="105" fill="url(#blobGrad)" stroke="#3E475C" stroke-width="2"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <!-- Simplex Noise Highlight Ribs -->
    <path d="M-80,-20 Q0,-90 80,-20 Q0,40 -80,-20" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <path d="M-60,30 Q0,-40 60,30 Q0,80 -60,30" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  </g>

  <!-- Floating Center Anchor Title -->
  <g id="PHANTOM / Center Anchor" transform="translate(720, 110)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#8C95A6" letter-spacing="2">SPATIAL INTELLIGENCE LAYER</text>
    <text x="0" y="44" text-anchor="middle" class="sans" font-size="44" font-weight="600" fill="#FFF" letter-spacing="3">PHANTOM</text>
    <text x="0" y="74" text-anchor="middle" class="serif" font-size="19" font-style="italic" fill="#9BA6B6">Core Intelligence Architecture</text>
  </g>

  <!-- Top UI Chrome Bar -->
  <g id="PHANTOM / Top Header Bar" transform="translate(40, 36)">
    <!-- Return to SMRITI Button -->
    <g transform="translate(0, 0)">
      <rect width="190" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="20" y="24" class="sans" font-size="13" font-weight="500" fill="#FFF">← Return to SMRITI</text>
      <rect x="150" y="11" width="28" height="16" rx="4" fill="rgba(255,255,255,0.1)"/>
      <text x="156" y="23" class="mono" font-size="9" fill="#8C95A6">ESC</text>
    </g>

    <!-- Telemetry Status Badge (Right) -->
    <g transform="translate(1080, 0)">
      <rect width="280" height="38" rx="19" fill="rgba(12,14,20,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <circle cx="20" cy="19" r="4" fill="#39FF6A"/>
      <text x="32" y="23" class="mono" font-size="10" font-weight="600" fill="#FFF">GRID: 0.25M</text>
      <text x="115" y="23" class="mono" font-size="10" fill="#696969">|</text>
      <text x="130" y="23" class="mono" font-size="10" fill="#98A2B3">LATENCY: 12MS</text>
      <text x="235" y="23" class="mono" font-size="10" font-weight="600" fill="#39FF6A">LIVE</text>
    </g>
  </g>

  <!-- Orbiting Ecosystem Module Nodes -->
  <!-- SMRITI Node (Left: 310, 340) -->
  <g id="PHANTOM / Module / SMRITI" transform="translate(205, 319)" filter="url(#shadowDark)">
    <rect width="210" height="42" rx="21" fill="#0E1117" stroke="#F07B42" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#F07B42"/>
    <text x="36" y="22" class="sans" font-size="13" font-weight="600" fill="#FFF">SMRITI</text>
    <text x="36" y="33" class="mono" font-size="8.5" fill="#8C95A6">HOME INTELLIGENCE</text>
    <text x="180" y="25" class="sans" font-size="12" fill="#F07B42">↗</text>
  </g>

  <!-- AEGIS Node (Right: 1110, 340) -->
  <g id="PHANTOM / Module / AEGIS" transform="translate(1005, 319)" filter="url(#shadowDark)">
    <rect width="210" height="42" rx="21" fill="#0E1117" stroke="#6EC1E4" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#6EC1E4"/>
    <text x="36" y="22" class="sans" font-size="13" font-weight="600" fill="#FFF">AEGIS</text>
    <text x="36" y="33" class="mono" font-size="8.5" fill="#8C95A6">CLINICAL INTELLIGENCE</text>
    <text x="180" y="25" class="sans" font-size="12" fill="#6EC1E4">↗</text>
  </g>

  <!-- LUMEN Node (Bottom: 720, 700) -->
  <g id="PHANTOM / Module / LUMEN" transform="translate(615, 679)" filter="url(#shadowDark)">
    <rect width="210" height="42" rx="21" fill="#0E1117" stroke="#B898FF" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#B898FF"/>
    <text x="36" y="22" class="sans" font-size="13" font-weight="600" fill="#FFF">LUMEN</text>
    <text x="36" y="33" class="mono" font-size="8.5" fill="#8C95A6">LABORATORY INTELLIGENCE</text>
    <text x="180" y="25" class="sans" font-size="12" fill="#B898FF">↗</text>
  </g>

  <!-- NOVA Planned Node -->
  <g id="PHANTOM / Module / NOVA" transform="translate(340, 620)">
    <rect width="160" height="34" rx="17" fill="#0E1117" stroke="#636B78" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="16" cy="17" r="3.5" fill="#636B78"/>
    <text x="28" y="17" class="sans" font-size="11" font-weight="600" fill="#8C95A6">NOVA · Mobility</text>
    <text x="28" y="27" class="mono" font-size="7.5" fill="#636B78">PLANNED</text>
  </g>

  <!-- ORBIT Planned Node -->
  <g id="PHANTOM / Module / ORBIT" transform="translate(940, 620)">
    <rect width="160" height="34" rx="17" fill="#0E1117" stroke="#636B78" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="16" cy="17" r="3.5" fill="#636B78"/>
    <text x="28" y="17" class="sans" font-size="11" font-weight="600" fill="#8C95A6">ORBIT · Industry</text>
    <text x="28" y="27" class="mono" font-size="7.5" fill="#636B78">PLANNED</text>
  </g>

  <!-- Bottom Hint Bar -->
  <g id="PHANTOM / Bottom Bar" transform="translate(40, 850)">
    <text x="0" y="16" class="mono" font-size="11" fill="#6D7684">PRESS <tspan fill="#CBD3DE" font-weight="600">ESC</tspan> OR CLICK OUTSIDE TO RETURN TO SMRITI</text>
    <text x="1360" y="16" text-anchor="end" class="mono" font-size="11" fill="#8C95A6">ACTIVE MODULES: <tspan fill="#FFF" font-weight="600">3 OF 5 ONLINE</tspan></text>
  </g>
</svg>
