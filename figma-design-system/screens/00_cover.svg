<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');
    text {
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
</style>
    <radialGradient id="coverGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#141824" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#07090E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030406" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2F3D"/>
      <stop offset="50%" stop-color="#12151D"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#coverGlow)"/>

  <!-- Star Dust & Ambient Grid Lines -->
  <g opacity="0.15">
    <circle cx="240" cy="180" r="1.5" fill="#FFF"/>
    <circle cx="890" cy="120" r="1.2" fill="#FFF"/>
    <circle cx="1600" cy="240" r="1.8" fill="#FFF"/>
    <circle cx="1720" cy="780" r="1.5" fill="#FFF"/>
    <circle cx="340" cy="890" r="1.2" fill="#FFF"/>
    <circle cx="1200" cy="940" r="1.5" fill="#FFF"/>
    <line x1="160" y1="540" x2="1760" y2="540" stroke="#FFF" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="960" y1="100" x2="960" y2="980" stroke="#FFF" stroke-width="0.5" stroke-dasharray="4 8"/>
  </g>

  <!-- Header Bar -->
  <g id="Cover / Header">
    <rect x="120" y="80" width="1680" height="60" fill="none"/>
    <rect x="120" y="80" width="220" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="138" cy="98" r="4" fill="#39FF6A"/>
    <text x="152" y="103" class="mono" font-size="11" font-weight="600" fill="#E4E7EC" letter-spacing="1.5">PRODUCTION HANDOFF</text>

    <!-- Version Badge -->
    <text x="1780" y="103" text-anchor="end" class="mono" font-size="12" fill="#9BA6B6" letter-spacing="1">VERSION 1.0.0 · FIGMA DESIGN SYSTEM</text>
  </g>

  <!-- Title & Narrative Block -->
  <g id="Cover / Hero Content">
    <text x="120" y="240" class="mono" font-size="13" font-weight="600" fill="#F07B42" letter-spacing="2.5">SPATIAL MEMORY × INTELLIGENCE ARCHITECTURE</text>
    <text x="120" y="340" class="sans" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">SMRITI <tspan fill="#CF4500">×</tspan> PHANTOM</text>
    <text x="120" y="410" class="serif" font-size="38" font-style="italic" fill="#C8D3E0">Your home remembers. The spatial intelligence engine behind everyday certainty.</text>

    <text x="120" y="470" class="sans" font-size="17" fill="#9BA6B6" width="700">
      <tspan x="120" dy="0">Complete, professional Figma Design System, Component Library &amp; Responsive Screen Suite.</tspan>
      <tspan x="120" dy="28">Reverse-engineered with 100% fidelity from the verified production deployment.</tspan>
    </text>
  </g>

  <!-- Interactive Ecosystem Preview Cards (Right Side) -->
  <g id="Cover / Preview Cards" transform="translate(1080, 220)">
    <!-- Card 1: SMRITI Warm Paper Canvas -->
    <g transform="translate(0, 0)" filter="url(#shadowLg)">
      <rect width="700" height="340" rx="20" fill="#F3F0EE" stroke="rgba(20,20,19,0.12)" stroke-width="1.5"/>
      <rect x="32" y="28" width="180" height="28" rx="14" fill="#FFFFFF" stroke="rgba(20,20,19,0.08)" stroke-width="1"/>
      <text x="46" y="46" class="sans" font-size="13" font-weight="600" fill="#141413">SMRITI<tspan fill="#CF4500">.</tspan></text>
      <text x="100" y="46" class="sans" font-size="11" fill="#696969">Home Experience</text>

      <text x="32" y="110" class="serif" font-size="36" fill="#141413">Your home <tspan font-style="italic">remembers.</tspan></text>
      <text x="32" y="145" class="sans" font-size="14" fill="#696969">SMRITI remembers where everyday things were and gently reveals what changed.</text>

      <!-- Receipt Mini Card -->
      <g transform="translate(32, 175)">
        <rect width="320" height="120" rx="12" fill="#FCFBFA" stroke="rgba(20,20,19,0.1)" stroke-width="1"/>
        <text x="20" y="28" class="mono" font-size="9" fill="#CF4500" letter-spacing="1">CONFIRMED DISPLACEMENT</text>
        <text x="20" y="54" class="sans" font-size="16" font-weight="600" fill="#141413">Reading glasses</text>
        <text x="20" y="80" class="mono" font-size="11" fill="#696969">Side table (2:10 PM) → Bookshelf (4:40 PM)</text>
        <rect x="20" y="94" width="100" height="16" rx="8" fill="#141413"/>
        <text x="32" y="106" class="sans" font-size="9" font-weight="600" fill="#F3F0EE">4.85M DELTA</text>
      </g>
    </g>

    <!-- Card 2: PHANTOM Void & Constellation -->
    <g transform="translate(40, 380)" filter="url(#shadowLg)">
      <rect width="660" height="340" rx="20" fill="#0E1117" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <rect x="32" y="28" width="220" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="48" cy="42" r="3.5" fill="#F07B42"/>
      <text x="60" y="46" class="mono" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="1">PHANTOM SPATIAL ENGINE</text>

      <!-- Center Blob Vector Simulation -->
      <circle cx="330" cy="170" r="70" fill="url(#blobGrad)" stroke="#353D4E" stroke-width="1.5"/>
      <circle cx="330" cy="170" r="85" fill="none" stroke="rgba(255,255,255,0.15)" stroke-dasharray="3 6"/>
      <circle cx="330" cy="170" r="105" fill="none" stroke="rgba(255,255,255,0.08)"/>

      <!-- Constellation Nodes -->
      <line x1="330" y1="170" x2="160" y2="120" stroke="#F07B42" stroke-width="1.5"/>
      <g transform="translate(90, 100)">
        <rect width="130" height="34" rx="17" fill="rgba(14,17,24,0.9)" stroke="#F07B42" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4" fill="#F07B42"/>
        <text x="32" y="21" class="sans" font-size="11" font-weight="600" fill="#FFF">SMRITI · Home</text>
      </g>

      <line x1="330" y1="170" x2="500" y2="130" stroke="#6EC1E4" stroke-width="1.5"/>
      <g transform="translate(430, 110)">
        <rect width="130" height="34" rx="17" fill="rgba(14,17,24,0.9)" stroke="#6EC1E4" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4" fill="#6EC1E4"/>
        <text x="32" y="21" class="sans" font-size="11" font-weight="600" fill="#FFF">AEGIS · Clinical</text>
      </g>

      <line x1="330" y1="170" x2="330" y2="280" stroke="#B898FF" stroke-width="1.5"/>
      <g transform="translate(265, 260)">
        <rect width="130" height="34" rx="17" fill="rgba(14,17,24,0.9)" stroke="#B898FF" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4" fill="#B898FF"/>
        <text x="32" y="21" class="sans" font-size="11" font-weight="600" fill="#FFF">LUMEN · Lab</text>
      </g>
    </g>
  </g>

  <!-- Page Directory Footer -->
  <g id="Cover / Page Index" transform="translate(120, 680)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#8C95A6" letter-spacing="2">FIGMA FILE STRUCTURE &amp; PAGE DIRECTORY</text>
    <line x1="0" y1="14" x2="880" y2="14" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <g transform="translate(0, 36)">
      <text x="0" y="0" class="mono" font-size="11" fill="#F07B42">00</text>
      <text x="40" y="0" class="sans" font-size="14" font-weight="500" fill="#FFF">Cover &amp; Overview</text>
      <text x="240" y="0" class="sans" font-size="12" fill="#8C95A6">File cover, system summary &amp; ecosystem index</text>

      <text x="0" y="32" class="mono" font-size="11" fill="#F07B42">01</text>
      <text x="40" y="32" class="sans" font-size="14" font-weight="500" fill="#FFF">Foundations</text>
      <text x="240" y="32" class="sans" font-size="12" fill="#8C95A6">Color tokens, typography matrix, spacing scale, grid rules</text>

      <text x="0" y="64" class="mono" font-size="11" fill="#F07B42">02</text>
      <text x="40" y="64" class="sans" font-size="14" font-weight="500" fill="#FFF">Components</text>
      <text x="240" y="64" class="sans" font-size="12" fill="#8C95A6">Master components: Nav pill, buttons, receipts, diff cards, nodes</text>

      <text x="0" y="96" class="mono" font-size="11" fill="#F07B42">03</text>
      <text x="40" y="96" class="sans" font-size="14" font-weight="500" fill="#FFF">SMRITI Desktop</text>
      <text x="240" y="96" class="sans" font-size="12" fill="#8C95A6">Complete 1440px editorial desktop landing page (Sections 00-09)</text>

      <text x="0" y="128" class="mono" font-size="11" fill="#F07B42">04</text>
      <text x="40" y="128" class="sans" font-size="14" font-weight="500" fill="#FFF">SMRITI Responsive</text>
      <text x="240" y="128" class="sans" font-size="12" fill="#8C95A6">768px Tablet reflow and 390px Mobile responsive layout</text>

      <text x="0" y="160" class="mono" font-size="11" fill="#F07B42">05</text>
      <text x="40" y="160" class="sans" font-size="14" font-weight="500" fill="#FFF">PHANTOM Experience</text>
      <text x="240" y="160" class="sans" font-size="12" fill="#8C95A6">Core intelligence layer, 3D entity, constellation &amp; active module drawers</text>

      <text x="0" y="192" class="mono" font-size="11" fill="#F07B42">06</text>
      <text x="40" y="192" class="sans" font-size="14" font-weight="500" fill="#FFF">Interaction States</text>
      <text x="240" y="192" class="sans" font-size="12" fill="#8C95A6">Default, hover, active, focus, disabled, timeline scrubbing matrix</text>

      <text x="0" y="224" class="mono" font-size="11" fill="#F07B42">07</text>
      <text x="40" y="224" class="sans" font-size="14" font-weight="500" fill="#FFF">Prototype &amp; User Flows</text>
      <text x="240" y="224" class="sans" font-size="12" fill="#8C95A6">End-to-end user journeys, transitions, easing curves &amp; triggers</text>

      <text x="0" y="256" class="mono" font-size="11" fill="#F07B42">08</text>
      <text x="40" y="256" class="sans" font-size="14" font-weight="500" fill="#FFF">Handoff &amp; Docs</text>
      <text x="240" y="256" class="sans" font-size="12" fill="#8C95A6">Developer token bindings, 3D coordinate digest, asset references</text>
    </g>
  </g>
</svg>
